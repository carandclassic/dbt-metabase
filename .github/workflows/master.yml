name: master

on:
  push:
    branches:
      - master
  release:
    types:
      - created

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code (actions/checkout)
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2.3.4
        with:
          python-version: "3.6.x"

      - name: Requirements
        run: make requirements

      - name: Build
        run: make build

      - name: Formatting check (black)
        run: make check-fmt

      - name: Lint Python check (pylint)
        run: make check-lint-python

      - name: Lint reStructuredText check (rst-lint)
        run: make check-lint-rst

      - name: Type check (mypy)
        run: make check-type

      - name: Test
        run: make test

      - name: Publish a Python distribution to PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }} # zizmor: ignore[secrets-outside-env,use-trusted-publishing] upstream publishes with an API token; no PyPI environment here
